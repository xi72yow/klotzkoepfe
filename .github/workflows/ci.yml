name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release? (yes/no)"
        required: true
        default: "no"
      version:
        description: "Version tag (e.g. v0.1.0). Leave empty to use Cargo.toml version."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - name: Install base tools
        run: apt-get update && apt-get install -y git curl build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev dpkg-dev apt-utils

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: debian12-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: debian12-cargo-

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      # --- Release steps (only on workflow_dispatch) ---

      - name: Determine version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            BASE="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            BASE="v${VERSION}"
          fi

          git fetch --tags
          LATEST_TAG=$(git tag -l "${BASE}-*" --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT_REV=$(echo "$LATEST_TAG" | sed "s/${BASE}-//")
            NEW_REV=$((CURRENT_REV + 1))
          else
            if git rev-parse "${BASE}" >/dev/null 2>&1; then
              NEW_REV=2
            else
              NEW_REV=1
            fi
          fi

          TAG="${BASE}-${NEW_REV}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "revision=${NEW_REV}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Generate changelog
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        run: ./scripts/generate-changelog.sh "${{ steps.version.outputs.revision }}"

      - name: Install cargo-deb
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        run: cargo install cargo-deb

      - name: Build .deb
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        run: cargo deb --no-build --deb-revision "${{ steps.version.outputs.revision }}"

      - name: Test .deb package
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        run: |
          DEB=$(ls target/debian/*.deb)
          echo "=== Package contents ==="
          dpkg-deb -c "$DEB"

          echo "=== Test install ==="
          dpkg -i "$DEB"

          echo "=== Verify binary ==="
          klotzkoepfe --version || true

      - name: Import GPG key
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Update APT repository
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        run: ./scripts/update-repo.sh

      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: target/debian/*.deb
          generate_release_notes: true

      - name: Upload repo artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo/

  deploy-pages:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
