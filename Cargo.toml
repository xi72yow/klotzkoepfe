[package]
name = "klotzkoepfe"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[dependencies]
bevy = { version = "0.15" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Schnellere Kompilierung im Dev
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
