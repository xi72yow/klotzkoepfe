[package]
name = "klotzkoepfe"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "Klotzkoepfe"

[package.metadata.deb]
depends = ""
maintainer = "xi72yow"
section = "games"

[dependencies]
bevy = { version = "0.18" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Schnellere Kompilierung im Dev
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
